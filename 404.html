<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found - Martin Chan</title>
<meta name="robots" content="noindex">
<style>
  :root { --pf-accent: #00bc8c; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #222;
    color: #fff;
    font-family: "Lato", "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .wrap { max-width: 520px; }
  .code { font-size: 72px; font-weight: 700; color: var(--pf-accent); line-height: 1; margin: 0 0 8px; }
  h1 { font-size: 24px; margin: 0 0 12px; font-weight: 400; }
  p { font-size: 16px; line-height: 1.6; color: #bbb; margin: 0 0 24px; }
  a { color: var(--pf-accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>Sorry, that page doesn&rsquo;t exist. It may have moved, or the link may be broken.</p>
    <p><a href="/">Back to the homepage</a></p>
  </div>
</body>
</html>
