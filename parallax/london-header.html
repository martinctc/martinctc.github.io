<style>
/* Parallax header. background-attachment: fixed is ignored by iOS Safari, so
   it is only applied where it actually works (desktop, fine pointer); every
   other device gets a plain cover image instead of a broken effect. */
.parallax {
    background-image: url("images/london-1405911_1920.jpg");
    height: 320px;
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
    background-attachment: scroll;
}
@media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
    .parallax { background-attachment: fixed; }
}
</style>

<!-- Container element -->
<div class="parallax">
</div>
